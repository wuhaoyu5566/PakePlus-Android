  D('xian-huashan','华山营地','西安','高端','五岳型','⛰️','陕西省华阴市华山','180-480元/晚',34.48,110.08,{fac:['水电桩','卫生间','淋浴','餐厅'],nb:'华山'}),
  D('xian-taibaishan','太白山营地','西安','高端','雪山型','🏔️','陕西省宝鸡市太白县','180-480元/晚',34.05,107.5,{fac:['水电桩','卫生间','淋浴','餐厅'],nb:'太白山'})
];

/* ========== 状态 ========== */
const FKEY = 'rv_favs_v1';
let favs = new Set(JSON.parse(localStorage.getItem(FKEY) || '[]'));
const saveFavs = () => localStorage.setItem(FKEY, JSON.stringify([...favs]));
let state = { q: '', city: 'all' };

/* ========== 工具 ========== */
const getRegion = c => CITY_REGION[c] || '其他';
const allCities = [...new Set(DATA.map(d => d.c))].sort((a, b) => {
  const ra = REGION_ORDER.indexOf(getRegion(a));
  const rb = REGION_ORDER.indexOf(getRegion(b));
  if (ra !== rb) return ra - rb;
  return a.localeCompare(b, 'zh');
});

/* ========== 渲染城市行 ========== */
function renderCityChips() {
  const chips = [`<button class="cchip ${state.city==='all'?'on':''}" data-city="all">全部城市</button>`]
    .concat(allCities.map(c => `<button class="cchip ${state.city===c?'on':''}" data-city="${c}">${c}</button>`))
    .join('');
  document.getElementById('city-chips').innerHTML = chips;
}

/* ========== 过滤 ========== */
function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.filter(d => {
    if (state.city !== 'all' && d.c !== state.city) return false;
    if (!q) return true;
    return [d.n, d.c, getRegion(d.c), d.lv, d.tg, ...d.t, ...d.fac, d.nb]
      .join(' ').toLowerCase().includes(q);
  });
}

/* ========== 列表渲染 ========== */
function render() {
  renderCityChips();
  const list = filtered();
  const cityCount = new Set(DATA.map(d => d.c)).size;
  let countText = `共 ${list.length} 个营地`;
  if (state.city === 'all') countText = `共 ${list.length} 个营地 · 覆盖 ${cityCount} 个城市`;
  else countText = `${state.city} · 共 ${list.length} 个营地`;
  document.getElementById('count').textContent = countText;

  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = `<div class="empty">没有匹配的营地，换个城市或关键词试试～</div>`;
    return;
  }
  el.innerHTML = list.map(d => `
    <div class="card" data-id="${d.id}">
      <div class="thumb">${d.e}<span class="lv">${d.lv}</span></div>
      <button class="fav" data-fav="${d.id}">${favs.has(d.id)?'❤️':'🤍'}</button>
      <div class="body">
        <h3>${d.n}</h3>
        <div class="meta">
          <span>📍 ${d.c}</span>
          <span class="price">💰 ${d.f}</span>
        </div>
        <div class="tags">${d.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="fac">${d.fac.slice(0,4).map(f=>`<span>${f}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

/* ========== 详情 ========== */
function openDetail(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  const [gcjLng, gcjLat] = toGcj(d.ll, d.coordSys);
  const navUrl = `https://uri.amap.com/marker?position=${gcjLng},${gcjLat}&name=${encodeURIComponent(d.n)}&callnative=1`;

  document.getElementById('panel').innerHTML = `
    <button class="close" data-close>✕</button>
    <h2>${d.e} ${d.n}</h2>
    <div class="meta"><span>📍 ${d.c}</span><span>${d.lv} · ${d.tg}</span></div>
    <div class="tags">${d.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <div class="grid2">
      <div class="kv"><div class="k">参考价</div><div class="v" style="color:#e87800;font-weight:600">${d.f}</div></div>
      <div class="kv"><div class="k">营位数量</div><div class="v">${d.s}</div></div>
      <div class="kv"><div class="k">开放时间</div><div class="v">${d.o}</div></div>
      <div class="kv"><div class="k">适宜季节</div><div class="v">${d.sea}</div></div>
    </div>
    <div class="row"><div class="k">地址</div><div class="v">${d.a}</div></div>
    <div class="row"><div class="k">营地介绍</div><div class="v">${d.i}</div></div>
    <div class="row"><div class="k">配套设施</div><div>${d.fac.map(f=>`<span>${f}</span>`).join('')}</div></div>
    <div class="row"><div class="k">周边景点</div><div class="v">${d.nb}</div></div>
    <div class="row"><div class="k">适合车型</div><div class="v">${d.car}</div></div>
    <div class="btns">
      <a class="primary" href="${navUrl}" target="_blank" rel="noopener">🧭 高德导航</a>
      <button data-fav="${d.id}">${favs.has(d.id)?'❤️ 已收藏':'🤍 收藏'}</button>
    </div>
    <div class="tip">价格与营位随季节变化，出发前请与营地方核实。坐标已转换为高德坐标系。</div>`;
  document.getElementById('sheet').classList.add('on');
}

function closeSheet() { document.getElementById('sheet').classList.remove('on'); }

/* ========== 事件 ========== */
document.getElementById('q').addEventListener('input', e => {
  state.q = e.target.value; render();
});

document.getElementById('city-chips').addEventListener('click', e => {
  const b = e.target.closest('[data-city]'); if (!b) return;
  state.city = b.dataset.city;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('list').addEventListener('click', e => {
  const fb = e.target.closest('[data-fav]');
  if (fb) { e.stopPropagation(); const id = fb.dataset.fav;
    favs.has(id)?favs.delete(id):favs.add(id); saveFavs(); render(); return; }
  const card = e.target.closest('[data-id]');
  if (card) openDetail(card.dataset.id);
});

document.getElementById('panel').addEventListener('click', e => {
  if (e.target.hasAttribute('data-close')) { closeSheet(); return; }
  const fb = e.target.closest('[data-fav]');
  if (!fb) return;
  const id = fb.dataset.fav;
  favs.has(id)?favs.delete(id):favs.add(id); saveFavs(); render(); openDetail(id);
});

document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.hasAttribute('data-close')) closeSheet();
});

render();
</script>
</body>
</html>
